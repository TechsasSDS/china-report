<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Service Report / 实时维修报告</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111820;
      --border: #1e3a2f;
      --primary: #00e676;       /* Green theme */
      --text: #c8facc;
      --success: #38bdf8;       /* Blue for success */
      --error: #ff4d4f;         /* Red for error */
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', Consolas, monospace; }
    body {
      margin: 0; padding: 20px;
      background: var(--bg); color: var(--text);
    }
    .header {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: space-between; align-items: center;
      margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 20px; color: var(--primary); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"] {
      background: var(--panel); border: 1px solid var(--primary);
      color: var(--text); padding: 8px 12px; border-radius: 6px; outline: none; min-width: 240px;
    }
    button {
      background: var(--primary); color: #05140a; font-weight: bold;
      border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #status { margin-bottom: 12px; font-size: 14px; font-weight: bold; }
    .msg-success { color: var(--success); }
    .msg-error { color: var(--error); }
    .table-wrap {
      overflow-x: auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td {
      padding: 10px 12px; text-align: left; vertical-align: middle;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th {
      background: #0d261a; color: var(--primary);
      position: sticky; top: 0; z-index: 1;
    }
    tr:hover { background: #14241c; }

    /* Live Image Thumbnails */
    .img-group { display: flex; gap: 6px; align-items: center; }
    .thumb {
      width: 56px; height: 56px; object-fit: cover;
      border: 1px solid var(--primary); border-radius: 6px;
      cursor: pointer; transition: transform 0.15s ease;
      background: #050a0e;
    }
    .thumb:hover { transform: scale(1.1); }

    /* Fullscreen Image Preview Modal */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    .modal.open { display: flex; }
    .modal img {
      max-width: 92vw; max-height: 82vh;
      border: 2px solid var(--primary); border-radius: 8px;
    }
    .modal-close {
      margin-top: 14px; padding: 8px 22px;
      background: var(--primary); color: #05140a;
      font-weight: bold; border: none; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Live Report / 实时数据报告</h1>
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search / 搜索..." oninput="filterTable()" />
      <button onclick="loadData()">🔄 Refresh / 刷新</button>
    </div>
  </div>

  <div id="status">Loading data... / 正在加载数据...</div>

  <div class="table-wrap">
    <table id="reportTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Image Zoom Modal -->
  <div id="imgModal" class="modal" onclick="closeModal()">
    <img id="modalImg" src="" alt="Preview" onclick="event.stopPropagation()" />
    <button class="modal-close" onclick="closeModal()">✖ Close / 关闭</button>
  </div>

  <script>
    let allRows = [];
    let headers = [];

    async function loadData() {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('data.json not found / 未找到数据文件 (Please sync from Google Sheet first)');

        const payload = await res.json();
        headers = payload.headers || [];
        allRows = payload.rows || [];

        renderTable(allRows);
        statusEl.className = 'msg-success';
        statusEl.textContent = `✔ Live Data Loaded Successfully / 实时数据加载成功 | Last Updated / 最后更新: ${payload.updatedAt} | Total Rows / 总计: ${allRows.length}`;
      } catch (err) {
        statusEl.className = 'msg-error';
        statusEl.textContent = '✖ Error / 错误: ' + err.message;
      }
    }

    function renderTable(rows) {
      document.getElementById('tableHead').innerHTML =
        '<tr>' + headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr>';

      document.getElementById('tableBody').innerHTML = rows.map(row =>
        '<tr>' + row.map(cell => `<td>${formatCell(cell)}</td>`).join('') + '</tr>'
      ).join('');
    }

    function formatCell(cell) {
      const str = String(cell ?? '').trim();
      if (str.includes('images/')) {
        const paths = str.split(',').map(p => p.trim()).filter(p => p.startsWith('images/'));
        if (paths.length > 0) {
          return '<div class="img-group">' + paths.map(p => {
            const safePath = escapeHtml(p);
            return `<img src="${safePath}" class="thumb" loading="lazy" onclick="openModal('${safePath}')" alt="Image" title="Click to zoom / 点击放大" />`;
          }).join('') + '</div>';
        }
      }
      if (/^https?:\/\//i.test(str)) {
        const safeUrl = escapeHtml(str);
        return `<a href="${safeUrl}" target="_blank" style="color:var(--primary);">${safeUrl}</a>`;
      }
      return escapeHtml(str);
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imgModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('imgModal').classList.remove('open');
      document.getElementById('modalImg').src = '';
    }

    function filterTable() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const filtered = allRows.filter(row =>
        row.some(cell => String(cell).toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function escapeHtml(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
